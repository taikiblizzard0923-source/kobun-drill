<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fdf8f9">
<title>問題ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--f-text-ja:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
body{margin:0}
img{max-width:100%}[hidden]{display:none!important}
/* Layout: mark-sheet answer booklet in a cool sakura tone — white & ink monochrome, one cherry-blossom pink accent; day strip on top, choices as answer-sheet ovals */
:root{
  --paper:#fdf8f9; --sheet:#ffffff; --ink:#1f1a24; --muted:#6b6270; --line:#eddfe4;
  --print:#c2477a;        /* sakura pink (accent) */
  --print-soft:#fbe6ee;
  --blue:#4b4766; --blue-soft:#ecebf3;
  --ok:#2f7a5a; --ok-soft:#e0f0e8; --ng:#b3364f; --ng-soft:#f9e1e7;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-en:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141117; --sheet:#1c181f; --ink:#f1e9ee; --muted:#a99fac; --line:#352d36;
  --print:#f08fb4; --print-soft:#3a2230; --blue:#b9b4dd; --blue-soft:#25223a;
  --ok:#6cc59c; --ok-soft:#1a3129; --ng:#f08a9f; --ng-soft:#3b1f27; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141117; --sheet:#1c181f; --ink:#f1e9ee; --muted:#a99fac; --line:#352d36;
  --print:#f08fb4; --print-soft:#3a2230; --blue:#b9b4dd; --blue-soft:#25223a;
  --ok:#6cc59c; --ok-soft:#1a3129; --ng:#f08a9f; --ng-soft:#3b1f27; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--print);padding-bottom:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--print);font-weight:700}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.2}
.count{display:flex;gap:18px}
.count div{display:flex;flex-direction:column;align-items:flex-end}
.count b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1;color:var(--print);font-variant-numeric:tabular-nums}
.count span{font-size:12px;color:var(--muted)}

/* day strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:14px 2px 10px;scrollbar-width:thin}
.chip{flex:0 0 auto;width:62px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.3}
.chip .d{font-weight:700;font-variant-numeric:tabular-nums}
.chip .w{font-size:11px;color:var(--muted)}
.cheer{margin:4px 0 6px;font-size:15px;line-height:1.7;border-left:3px solid var(--print);padding:4px 0 4px 12px;color:var(--ink)}
.must{display:inline-block;font-family:var(--f-body);font-size:12px;font-weight:700;color:#fff;background:var(--print);border-radius:4px;padding:1px 7px;margin-right:8px;vertical-align:2px;letter-spacing:.03em}
.must-miss{font-size:13px;font-weight:700;color:var(--ng)}
.ex .must-h{color:#fff;background:var(--print)}
.chip .o{font-size:10.5px;color:var(--print);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.chip.sel .o{color:var(--paper)}
.oshi{align-self:flex-start;font-family:var(--f-display);font-size:15px;color:var(--print);background:var(--print-soft);border-radius:999px;padding:3px 14px}
.oshi b{font-weight:800;font-size:17px;margin:0 2px}
.chip .s{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);min-height:1.3em}
.chip.today{border-color:var(--print)}
.chip.today .w{color:var(--print);font-weight:700}
.chip.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.sel .w,.chip.sel .s{color:var(--paper)}
.chip.done .s{color:var(--ok)}
.chip.sel.done .s{color:var(--paper)}
.chip.exam{border-style:dashed;border-color:var(--print)}

/* day */
.dayhead{display:flex;flex-direction:column;gap:4px;margin:14px 0 16px}
.dayhead .meta{font-size:13px;color:var(--muted)}
.dayhead h2{font-size:22px;font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:1px 8px;border-radius:4px;margin-right:6px;vertical-align:2px}
.tag.R,.tag.t-blue{background:var(--blue-soft);color:var(--blue)}
.tag.L,.tag.t-accent{background:var(--print-soft);color:var(--print)}
.tag.t-ink{background:var(--ink);color:var(--paper)}
section.block{margin-top:26px}
section.block>h3{font-size:13px;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tasks li{display:grid;grid-template-columns:28px 52px 1fr;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.tasks input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--print)}
.tasks .min{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.tasks li.chk .txt{color:var(--muted);text-decoration:line-through}
.tasks .txt{min-width:0}

/* vocab */
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.vw{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:6px 10px;text-align:left;display:flex;flex-direction:column;line-height:1.35;min-height:52px}
.vw .en{font-family:var(--f-en);font-weight:600;font-size:16px}
.vw .ja{font-size:13px;color:var(--muted);visibility:hidden}
.vw.open .ja{visibility:visible}
.small-btn{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:2px 10px;font-size:12px;font-weight:500;letter-spacing:0}

/* set */
.set{background:var(--sheet);border:1px solid var(--line);border-radius:10px;margin-top:14px}
.set>summary{list-style:none;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.set>summary::-webkit-details-marker{display:none}
.set>summary .t{font-weight:700;min-width:0}
.set>summary .r{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.set>summary .r.ok{color:var(--ok);font-weight:700}
.setbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.dir{font-size:13px;color:var(--muted);border-left:3px solid var(--print);padding-left:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.play{border-color:var(--print);color:var(--print)}
.btn:disabled{opacity:.45;cursor:default}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.timer.over{color:var(--ng)}
.passage{font-family:var(--f-en);font-size:16.5px;line-height:1.75;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px;max-height:60vh;overflow:auto}
.passage p{margin:0 0 .9em}
.passage p:last-child{margin:0}
.passage h4{font-family:var(--f-en);font-size:16px;margin:.4em 0 .2em}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;min-width:100%}
.tbl caption{text-align:left;font-weight:700;padding-bottom:6px;font-family:var(--f-en)}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 10px;text-align:left}
.tbl th{background:var(--paper)}
.script{font-family:var(--f-en);font-size:15px;background:var(--paper);border:1px dashed var(--line);border-radius:6px;padding:10px 14px}
.script p{margin:0 0 .4em}
.script b{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-right:6px}

/* items */
.item{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.qrow{display:flex;gap:10px;align-items:flex-start}
.qno{font-family:var(--f-display);font-weight:400;color:var(--print);font-size:15px;min-width:26px;font-variant-numeric:tabular-nums;line-height:1.6}
.qtext{font-family:var(--f-en);font-size:16px;min-width:0}
.choices{display:flex;flex-direction:column;gap:4px;padding-left:36px}
.ch{display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:transparent;padding:5px 6px;border-radius:6px;font-family:var(--f-en);font-size:15.5px;line-height:1.5}
.ch:hover{background:var(--paper)}
.oval{flex:0 0 auto;width:22px;height:30px;border:1.5px solid var(--print);border-radius:50%;display:grid;place-items:center;font-family:var(--f-body);font-size:11px;color:var(--print);margin-top:-3px}
.ch.on .oval{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ch .ctext{min-width:0;padding-top:1px}
.item.graded .ch{cursor:default}
.item.graded .ch.correct{background:var(--ok-soft)}
.item.graded .ch.correct .oval{border-color:var(--ok)}
.item.graded .ch.on.wrong{background:var(--ng-soft)}
.mark{font-weight:700;font-size:13px}
.mark.ok{color:var(--ok)} .mark.ng{color:var(--ng)}
.ex{font-size:14px;background:var(--paper);border-radius:6px;padding:8px 12px;margin-left:36px}
.result{border:2px solid var(--ink);border-radius:8px;padding:10px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.result b{font-family:var(--f-display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.result span{font-size:13px;color:var(--muted)}
.guide{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
.guide>summary{padding:10px 14px;font-weight:700;font-size:14px;color:var(--print)}
.guide-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.gcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.gcols>div{min-width:0;overflow-x:auto}
.gcols h4{margin:0 0 6px;font-size:14px}
.gt{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.gt td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:top}
.gt td:first-child{font-weight:700;white-space:nowrap}
.gt td:nth-child(n+3){white-space:nowrap;text-align:right}
.tips{margin:0;padding-left:1.2em;font-size:14px;display:flex;flex-direction:column;gap:4px}
/* explanations & translations */
.ex p{margin:0 0 6px}
.ex p:last-child{margin:0}
.ex .exh{display:inline-block;font-size:12px;letter-spacing:.06em;color:var(--print);background:var(--print-soft);border-radius:4px;padding:0 6px;margin-right:6px}
.script .ja{display:block;font-family:var(--f-body);font-size:13.5px;color:var(--muted);margin-top:2px}
.passage-ja{font-size:14.5px;line-height:1.8;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-top:8px}
.passage-ja p{margin:0 0 .8em}
.passage-ja h4{margin:.2em 0}
details>summary{cursor:pointer}
.src details>summary,.item details>summary{font-size:14px;font-weight:700;color:var(--blue);padding:6px 0}
.item details.indent{margin-left:36px}
/* split: source on the left, questions on the right on tablets */
.split{display:flex;flex-direction:column;gap:14px}
.src,.qs{display:flex;flex-direction:column;gap:12px;min-width:0}
button,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
@media (min-width: 700px){
  body{font-size:17px}
  .wrap{max-width:1180px}
  .qtext{font-size:18px}
  .ch{font-size:17px;min-height:48px;align-items:center;padding:8px 10px}
  .oval{width:26px;height:36px;font-size:12px;margin-top:0}
  .btn{padding:9px 18px;font-size:15px}
  .passage{font-size:18px}
  .ex{font-size:15.5px;line-height:1.75}
  .chip{width:72px;padding:8px 4px}
  .vocab{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .tasks input{width:24px;height:24px}
  .tasks li{grid-template-columns:34px 60px 1fr;padding:12px 0}
}
@media (min-width: 900px){
  .split.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
  .split.two .src{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);max-height:calc(100vh - 24px);overflow:auto;-webkit-overflow-scrolling:touch;padding-right:4px}
  .split.two .passage{max-height:none;overflow:visible}
}
.write textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--sheet);color:var(--ink);margin-left:0}
.item .write{padding-left:36px}
.selfmark{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.selfmark .btn{padding:4px 12px;font-size:13px}
.vw.rev{border-style:dashed}
.examday h3{color:var(--print)!important}
.guidelink{display:flex;justify-content:space-between;align-items:center;margin-top:10px;border:1px solid var(--print);border-radius:10px;padding:10px 14px;color:var(--print);font-weight:700;font-size:14px;text-decoration:none;background:var(--sheet)}
.guidelink::after{content:"→"}
.misslink{border-color:var(--ink);color:var(--ink)}
.missgrp{background:var(--sheet);border:1px solid var(--line);border-radius:10px;margin-top:14px;padding:12px 16px}
.missgrp>h4{margin:0 0 6px;font-size:14px}
.missgrp>h4 a{color:var(--print);text-decoration:none;margin-right:8px}
.missfix{color:var(--ok);font-weight:700;font-size:13px}
.extra{border:1px dashed var(--print);border-radius:10px;padding:10px 14px;margin-top:14px}
.extra h3{color:var(--print)!important}
.player{display:flex;flex-direction:column;gap:2px;width:100%;max-width:520px}
.player audio{width:100%;height:40px}
.pending{background:var(--sheet);border:1px dashed var(--line);border-radius:10px;padding:24px 16px;color:var(--muted);text-align:center}
.note{font-size:12px;color:var(--muted)}
.foot{margin-top:40px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
/* Japanese-text mode (config.lang==="ja") */
.ja-text .passage,.ja-text .qtext,.ja-text .ch,.ja-text .vw .en,.ja-text .passage h4{font-family:var(--f-text-ja)}
.ja-text .passage{line-height:2;letter-spacing:.02em}
.ja-text .vw .en{font-weight:600}
.ja-text .passage .src-note{display:block;text-align:right;font-size:.85em;color:var(--muted)}
.passage u,.qtext u,.ch u{text-decoration:none;border-bottom:1.5px solid var(--print);padding-bottom:1px}
/* vertical writing (縦書き) for the passage only */
.passage.vert{writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;height:min(64vh,540px);max-height:none;overflow-x:auto;overflow-y:hidden;line-height:1.9;padding:16px 14px}
.passage.vert p,.passage.vert h4{margin:0;margin-block-end:1em}
.passage.vert u{border-bottom:0;border-right:1.5px solid var(--print);padding-bottom:0;padding-right:2px}
.passage.vert .lbl{text-combine-upright:all;-webkit-text-combine:horizontal;vertical-align:baseline;margin:0 0 2px}
.passage.vert .src-note{text-align:end;margin-block-start:.5em}
.vbtn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:13px}
@media (min-width:900px){.split.two .passage.vert{height:calc(100vh - 150px);max-height:none;overflow-x:auto;overflow-y:hidden}}
.passage .lbl{font-family:var(--f-body);font-size:.72em;color:var(--print);font-weight:700;vertical-align:.35em;margin-right:1px}
</style>
<style id="accent"></style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow" id="eyebrow"></span>
      <h1 id="heading"></h1>
    </div>
    <div class="count">
      <div><b id="left">–</b><span id="leftlabel">本番まで</span></div>
      <div><b id="donecount">0</b><span>完了した日</span></div>
    </div>
  </header>

  <details class="guide" id="guide" hidden>
    <summary id="guidetitle">本番の構成と攻略メモ</summary>
    <div class="guide-body" id="guidebody"></div>
  </details>

  <a class="guidelink" id="guidelink" hidden></a>
  <a class="guidelink misslink" id="misslink" href="#miss">間違えた問題の解き直し</a>
  <nav class="strip" id="strip" aria-label="日付"></nav>
  <main id="day"></main>

  <p class="foot" id="foot"></p>
</div>

<script src="data/config.js"></script>
<script>
/* Generic day-by-day drill engine. All exam-specific content lives in data/config.js and data/days/*.js. */
(function(){
  const C = window.DRILL_CONFIG || {};
  const files = (C.dataFiles||[]).concat(C.extraFiles||[]);
  let pending = files.length;
  const done = () => { if(--pending<=0) start(); };
  if(!pending) start();
  files.forEach(f=>{ const s=document.createElement("script"); s.src=f; s.async=false; s.onload=done; s.onerror=done; document.body.appendChild(s); });

function start(){
  const DRILL = window.DRILL || window.TEAP || {days:{}};
  DRILL.days = DRILL.days || {};
  const META = C.days || {};
  const SKILLS = C.skills || { R:{label:"READING",tone:"blue"}, L:{label:"LISTENING",tone:"accent"} };
  const EXAMS = (C.exams && C.exams.length ? C.exams : (C.examDate ? [{date:C.examDate,label:"本番"}] : [])).slice().sort((a,b)=>a.date<b.date?-1:1);
  const examsOn = ds => EXAMS.filter(e=>e.date===ds);
  const EXAM = EXAMS.length ? EXAMS[EXAMS.length-1].date : "";
  const DAYS = [];
  for(let d=new Date(C.start+"T00:00:00"); d<=new Date(C.end+"T00:00:00"); d.setDate(d.getDate()+1)) DAYS.push(ymd(d));
  EXAMS.forEach(e=>{ if(e.date>C.end && !DAYS.includes(e.date)) DAYS.push(e.date); }); // exam days after the last drill day still get a chip
  const WK = ["日","月","火","水","木","金","土"];
  function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

  // ---- config → page chrome ----
  document.title = C.title || "問題ドリル";
  document.getElementById("eyebrow").textContent = C.eyebrow || "";
  document.getElementById("heading").textContent = C.heading || C.title || "";
  document.getElementById("leftlabel").textContent = C.examLabel || "本番まで";
  document.getElementById("foot").textContent = C.foot || "";
  const mt=document.createElement("meta"); mt.name="apple-mobile-web-app-title"; mt.content=C.title||""; document.head.appendChild(mt);
  if(C.guideHTML){ const g=document.getElementById("guide"); g.hidden=false; document.getElementById("guidetitle").textContent=C.guideTitle||"攻略メモ"; document.getElementById("guidebody").innerHTML=C.guideHTML; }
  if(C.guidePage){ const gl=document.getElementById("guidelink"); gl.hidden=false; gl.href=C.guidePage; gl.textContent=C.guidePageLabel||"入試方式ガイド"; }
  if(C.lang==="ja") document.body.classList.add("ja-text");
  if(C.accent){ const a=C.accent, v=(p,s)=>"--print:"+p+";--print-soft:"+s+";";
    document.getElementById("accent").textContent=":root{"+v(a.light,a.soft)+"}"+
      "@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){"+v(a.dark,a.darkSoft)+"}}:root[data-theme=\"dark\"]{"+v(a.dark,a.darkSoft)+"}"; }
  const labelOf = ds => META[ds]&&META[ds].label ? (C.labelFormat||"今日は{label}の日").replace("{label}", META[ds].label) : "";

  // ---- storage (per-device convenience) ----
  const KEY="drill-"+(C.id||"default")+"-v1";

  S.ans=S.ans||{}; S.graded=S.graded||{}; S.tasks=S.tasks||{}; S.self=S.self||{}; S.txt=S.txt||{};

  const vertOn=()=> S.vert==null ? !!C.vertical : !!S.vert;

  const TODAY=ymd(new Date());
  function fmt(ds){ const d=new Date(ds+"T00:00:00"); return {md:(d.getMonth()+1)+"/"+d.getDate(), w:WK[d.getDay()]}; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
  // light markup: [[ア|text]] = labelled underline, __text__ = underline
  function rich(s){ return esc(s).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="lbl">$1</span><u>$2</u>').replace(/__([^_]+)__/g,'<u>$1</u>').replace(/\n/g,"<br>"); }
  function paras(text){ return String(text).split(/\n\n+/).map(par=>{ const m=par.match(/^#\s*(.+)$/); if(m) return '<h4>'+rich(m[1])+'</h4>';
    const n=par.match(/^（出典[：:]?(.+)）$/)||par.match(/^\((出典.+)\)$/); return n?'<span class="src-note">'+esc(par)+'</span>':'<p>'+rich(par)+'</p>'; }).join(""); }

  // an item is correct if the chosen index matches, or (written items) the learner self-marked it ○
  function isOk(it,ik){ return it.type==="write" ? S.self[ik]===1 : S.ans[ik]===it.a; }
  function dayStats(ds){
    const day=DRILL.days[ds]; if(!day) return null;
    let total=0,correct=0,gradedSets=0;
    (day.sets||[]).forEach(s=>{ const k=ds+"|"+s.id; if(S.graded[k]){ gradedSets++; total+=s.items.length;
      s.items.forEach((it,i)=>{ if(isOk(it,k+"|"+i)) correct++; }); }});
    const taskDone=(day.tasks||[]).filter((t,i)=>S.tasks[ds+"|"+i]).length;
    const allSets=(day.sets||[]).length;
    return {total,correct,gradedSets,allSets,taskDone,allTasks:(day.tasks||[]).length,
      done: allSets>0 ? gradedSets===allSets : (day.tasks||[]).length>0 && taskDone===(day.tasks||[]).length};
  }

    else if(EXAMS.length){ el.textContent="終了"; } else el.parentNode.hidden=true;

  function fromHash(){ const m=(location.hash||"").match(/^#d(\d{4})?(\d{4})$/); if(!m) return null;
    const hit=DAYS.find(d=>d.slice(5).replace("-","")===m[2] && (!m[1]||d.startsWith(m[1]))); return hit||null; }
  current = fromHash() || current;

  // ---- audio (only for sets with script) ----
  const synth = window.speechSynthesis;
  let voices=[];
  const vlang = C.speechLang || "en";
  function loadVoices(){ try{ voices=(synth&&synth.getVoices()||[]).filter(v=>v.lang.toLowerCase().startsWith(vlang)); }catch(e){ voices=[]; } }
  if(synth){ loadVoices(); try{ synth.onvoiceschanged=loadVoices; }catch(e){} }
  function pickVoice(sp){
    if(!voices.length) return null;
    const fem=voices.filter(v=>/female|samantha|zira|jenny|aria|karen|victoria|allison|ava|susan|kyoko|google us english/i.test(v.name));
    const mal=voices.filter(v=>/male|daniel|alex|david|guy|fred|tom|aaron|rishi|otoya/i.test(v.name)&&!/female/i.test(v.name));
    if(sp==="W"||sp==="W2") return fem[sp==="W2"?1:0]||fem[0]||voices[0];
    return mal[sp==="M2"?1:0]||mal[0]||voices[0];
  }
  let speakingBtn=null;
  function stopSpeak(){ try{ synth&&synth.cancel(); }catch(e){} if(speakingBtn){ speakingBtn.textContent=speakingBtn.dataset.label; speakingBtn=null; }
    document.querySelectorAll("audio").forEach(a=>{ try{ a.pause(); }catch(e){} }); }
  function speak(lines, btn){
    if(!synth){ btn.textContent="音声が使えません"; return; }
    if(speakingBtn===btn){ stopSpeak(); return; }
    stopSpeak(); speakingBtn=btn; btn.textContent="■ 停止";
    lines.forEach((ln,i)=>{
      const u=new SpeechSynthesisUtterance(ln.t);
      const v=pickVoice(ln.sp); if(v){ u.voice=v; u.lang=v.lang; } else u.lang=vlang==="en"?"en-US":vlang;
      u.rate=0.95; u.pitch = ({W:1.15,W2:1.3,M:0.85,M2:0.7})[ln.sp]||1;
      if(i===lines.length-1) u.onend=()=>{ if(speakingBtn===btn){ btn.textContent=btn.dataset.label; speakingBtn=null; } };
      synth.speak(u);
    });

  const AUDIO = window.DRILL_AUDIO || window.TEAP_AUDIO || {};
  // iPad/iPhone Safari needs byte-range responses to stream media; load each file whole and play it from a blob URL instead.
  const blobCache = {};
  function loadAudios(root){
    root.querySelectorAll("audio[data-src]").forEach(a=>{
      const src=a.dataset.src; delete a.dataset.src;
      const note=a.parentNode && a.parentNode.querySelector(".note");
      const set=u=>{ a.src=u; try{ a.load(); }catch(e){} if(note) note.textContent=note.dataset.label; };
      if(note){ note.dataset.label=note.textContent; note.textContent=note.textContent+"（音声を読み込み中…）"; }
      if(blobCache[src]){ blobCache[src].then(set); return; }
      blobCache[src]=fetch(src).then(r=>{ if(!r.ok) throw new Error(r.status); return r.blob(); })
        .then(b=>URL.createObjectURL(new Blob([b],{type:"audio/mpeg"}))).catch(()=>src);
      blobCache[src].then(set);
    });
  }
  const MUST = window.DRILL_MUST || window.TEAP_MUST || {};

  // spaced review: config.vocabReview words drawn from earlier days (1,3,7,14,28 days back first, then the rest), deterministic per date
  function reviewWords(ds, nNew){
    const want=(C.vocabReview||0); if(!want || ds<(C.vocabReviewFrom||"")) return [];
    const i=DAYS.indexOf(ds), seen=new Set(), out=[];
    const push=d=>{ const dd=DRILL.days[d]; if(!dd||!dd.vocab) return; const vs=dd.vocab.slice();
      let h=0; for(const c of ds) h=(h*31+c.charCodeAt(0))>>>0;
      for(let j=0;j<vs.length && out.length<want;j++){ const v=vs[(j+h)%vs.length]; if(!seen.has(v[0])){ seen.add(v[0]); out.push([v[0],v[1],"rev"]); if(out.length%2===0) break; } } };
    [1,3,7,14,28,42,56].forEach(b=>{ if(i-b>=0) push(DAYS[i-b]); });
    for(let b=2;out.length<want && i-b>=0;b++) push(DAYS[i-b]);
    return out.slice(0,want);
  }

    head.innerHTML=(on?'<span class="oshi">'+esc((C.oshiFormat||"今日は{name}の日").split("{name}")[0])+'<b>'+esc(on)+'</b>'+esc((C.oshiFormat||"今日は{name}の日").split("{name}")[1]||"")+'</span>':(lab?'<span class="oshi">'+esc(lab)+'</span>':''))+(meta.cheer?'<p class="cheer">'+esc(meta.cheer)+'</p>':'')+'<span class="meta">'+f.md+'（'+f.w+'）· Day '+idx+(day&&day.minutes?' · 目安 '+day.minutes+'分':'')+(on&&lab?' · '+esc(lab):'')+'</span><h2>'+esc(day&&day.theme?day.theme:(meta.plan||""))+'</h2>';
    main.appendChild(head);

    if(ex.length){
      const p=document.createElement("section"); p.className="block examday";
      p.innerHTML='<h3><span>本番：'+ex.map(e=>esc(e.label)).join("／")+'</span></h3><ul class="tasks">'+ex.reduce((a,e)=>a.concat(e.list||[]),[]).concat(C.examDayList||[]).map(t=>'<li style="grid-template-columns:1fr"><span class="txt">'+esc(t)+'</span></li>').join("")+'</ul>';
      main.appendChild(p); if(!day) return;
    }
    if(!day){ const p=document.createElement("div"); p.className="pending"; p.textContent="この日の問題は準備中です。"; main.appendChild(p); return; }

    // tasks
    const ts=document.createElement("section"); ts.className="block";
    ts.innerHTML='<h3><span>今日やること</span><span>'+day.tasks.reduce((n,t)=>n+(t.min||0),0)+'分</span></h3>';
    const ul=document.createElement("ul"); ul.className="tasks";
    day.tasks.forEach((t,i)=>{
      const k=current+"|"+i, li=document.createElement("li"); if(S.tasks[k]) li.className="chk";
      const id="t"+current.replace(/-/g,"")+"_"+i;
      li.innerHTML='<input type="checkbox" id="'+id+'"'+(S.tasks[k]?" checked":"")+'><span class="min">'+(t.min?t.min+"分":"")+'</span><label class="txt" for="'+id+'">'+esc(t.text)+'</label>';
      li.querySelector("input").addEventListener("change",e=>{ if(e.target.checked) S.tasks[k]=1; else delete S.tasks[k]; save(); li.classList.toggle("chk",e.target.checked); renderHead(); renderStrip(); });
      ul.appendChild(li);
    });
    ts.appendChild(ul); main.appendChild(ts);
    const xs=(C.extra||{})[current];
    if(xs&&xs.length){
      const xb=document.createElement("section"); xb.className="block extra";
      xb.innerHTML='<h3><span>過去問（別枠・40分のドリルとは別の時間）</span><span>'+xs.reduce((n,t)=>n+(t.min||0),0)+'分</span></h3>';
      const xu=document.createElement("ul"); xu.className="tasks";
      xs.forEach((t,i)=>{ const k=current+"|x"+i, li=document.createElement("li"); if(S.tasks[k]) li.className="chk"; const id="x"+current.replace(/-/g,"")+"_"+i;
        li.innerHTML='<input type="checkbox" id="'+id+'"'+(S.tasks[k]?" checked":"")+'><span class="min">'+(t.min?t.min+"分":"")+'</span><label class="txt" for="'+id+'">'+esc(t.text)+'</label>';
        li.querySelector("input").addEventListener("change",e=>{ if(e.target.checked) S.tasks[k]=1; else delete S.tasks[k]; save(); li.classList.toggle("chk",e.target.checked); });
        xu.appendChild(li); });
      xb.appendChild(xu); main.appendChild(xb);
    }

    // vocab
    const review = reviewWords(current, (day.vocab||[]).length);
    const vlist = (day.vocab||[]).map(v=>v.concat("new")).concat(review);
    if(vlist.length){
      const vs=document.createElement("section"); vs.className="block";
      vs.innerHTML='<h3><span>'+esc(C.vocabLabel||"今日の語彙")+' '+vlist.length+'語（タップで意味）'+(review.length?'· 新'+(day.vocab||[]).length+'＋復習'+review.length:'')+'</span></h3>';
      const all=document.createElement("button"); all.type="button"; all.className="small-btn"; all.textContent="全部表示";
      vs.querySelector("h3").appendChild(all);
      const g=document.createElement("div"); g.className="vocab";
      vlist.forEach(v=>{ const b=document.createElement("button"); b.type="button"; b.className="vw"+(v[2]==="rev"?" rev":"");
        b.innerHTML='<span class="en">'+esc(v[0])+'</span><span class="ja">'+esc(v[1])+'</span>';
        b.addEventListener("click",()=>b.classList.toggle("open")); g.appendChild(b); });
      all.addEventListener("click",()=>{ const open=all.textContent==="全部表示"; g.querySelectorAll(".vw").forEach(x=>x.classList.toggle("open",open)); all.textContent=open?"全部隠す":"全部表示"; });
      vs.appendChild(g); main.appendChild(vs);
    }

    // sets
    const ss=document.createElement("section"); ss.className="block";
    const total=day.sets.reduce((n,s)=>n+s.items.length,0);
    ss.innerHTML='<h3><span>予想問題</span><span>'+total+'問</span></h3>';
    day.sets.forEach(s=>ss.appendChild(renderSet(current,s, openSet?openSet===s.id:false)));
    main.appendChild(ss);
    if(openSet){ const el=[...ss.querySelectorAll(".set")].find(d=>d.open); if(el) el.scrollIntoView({block:"start"}); }
  }

  // ---- wrong answers list (#miss) ----
  S.fixed=S.fixed||{};
  function missList(){
    const out=[];
    Object.keys(DRILL.days).sort().forEach(ds=>{ (DRILL.days[ds].sets||[]).forEach(set=>{ const k=ds+"|"+set.id; if(!S.graded[k]) return;
      set.items.forEach((it,i)=>{ const ik=k+"|"+i; if(S.fixed[ik]) return;
        const wrong = it.type==="write" ? S.self[ik]===0 : S.ans[ik]!==it.a;
        if(wrong) out.push({ds,set,it,i,ik,must:!!MUST[ik]}); }); }); });
    return out;
  }
  function updateMissLink(){ const n=missList().length; const a=document.getElementById("misslink"); a.textContent="間違えた問題の解き直し（"+n+"問）"; }
  let onlyMust=false;
  function renderMiss(){
    stopSpeak(); renderHead(); renderStrip(); updateMissLink();
    const main=document.getElementById("day"); main.innerHTML="";
    const list=missList().filter(x=>!onlyMust||x.must);
    const head=document.createElement("div"); head.className="dayhead";
    head.innerHTML='<h2>間違えた問題の解き直し</h2><span class="meta">答え合わせ済みのセットで間違えた問題（記述は自己採点で×にしたもの）。解き直して正解すると一覧から消えます。</span>';
    const tg=document.createElement("label"); tg.className="note"; tg.innerHTML='<input type="checkbox"'+(onlyMust?" checked":"")+'> ★落とせない問題だけ表示';
    tg.querySelector("input").addEventListener("change",e=>{ onlyMust=e.target.checked; renderMiss(); });
    head.appendChild(tg); main.appendChild(head);
    if(!list.length){ const p=document.createElement("div"); p.className="pending"; p.textContent=onlyMust?"★の間違いはありません。":"間違えた問題はありません。"; main.appendChild(p); return; }
    const groups={}; list.forEach(x=>{ (groups[x.ds+"|"+x.set.id]=groups[x.ds+"|"+x.set.id]||[]).push(x); });
    Object.keys(groups).forEach(gk=>{
      const g=groups[gk], set=g[0].set, ds=g[0].ds, f=fmt(ds);
      const box=document.createElement("section"); box.className="missgrp";
      box.innerHTML='<h4><a href="#d'+ds.replace(/-/g,"")+'">'+f.md+'（'+f.w+'）</a>'+esc(set.title)+'</h4>';
      if(set.passage){ const d=document.createElement("details"); d.innerHTML='<summary>本文を見る</summary>'; const p=document.createElement("div"); p.className="passage"; p.innerHTML=paras(set.passage); d.appendChild(p); box.appendChild(d); }
      const LB = set.labels==="iroha" ? "イロハニホヘトチ" : set.labels==="abc" ? "ABCDEFGH" : set.labels==="aiu" ? "アイウエオカキク" : null;
      const lb = ci => LB ? LB[ci] : String(ci+1);
      g.forEach(x=>{
        const it=x.it, item=document.createElement("div"); item.className="item";
        item.innerHTML='<div class="qrow"><span class="qno">'+(x.i+1)+'</span><span class="qtext">'+(x.must?'<span class="must">★ 落とせない</span>':'')+rich(it.q)+'</span></div>';
        const res=document.createElement("div");
        const showEx=ok=>{ res.className="ex"; res.innerHTML='<p><span class="mark '+(ok?"ok":"ng")+'">'+(ok?"正解！一覧から外しました":"不正解 · 正解は "+(it.type==="write"?"解答例のとおり":lb(it.a)))+'</span></p>'+(it.type==="write"?'<p><b class="exh">解答例</b>'+rich(it.ans||"")+'</p>':'')+'<p>'+exHTML(it.ex);
          if(ok){ S.fixed[x.ik]=Date.now(); save(); updateMissLink(); } };
        if(it.type==="write"){
          const ta=document.createElement("textarea"); ta.rows=2; ta.style.width="100%"; ta.placeholder="もう一度書いてみる";
          const b=document.createElement("button"); b.type="button"; b.className="btn"; b.textContent="解答例を見る";
          const sm=document.createElement("p"); sm.className="selfmark";
          b.addEventListener("click",()=>{ res.className="ex"; res.innerHTML='<p><b class="exh">解答例</b>'+rich(it.ans||"")+'</p><p>'+exHTML(it.ex); sm.innerHTML='<span class="note">今回は：</span>';
            [[1,"○ できた"],[0,"× まだ"]].forEach(([v,t])=>{ const bb=document.createElement("button"); bb.type="button"; bb.className="btn"; bb.textContent=t; bb.addEventListener("click",()=>{ if(v){ S.fixed[x.ik]=Date.now(); S.self[x.ik]=1; save(); updateMissLink(); sm.innerHTML='<span class="missfix">一覧から外しました</span>'; } else sm.innerHTML='<span class="note">また明日やってみよう</span>'; }); sm.appendChild(bb); }); });
          const w=document.createElement("div"); w.className="write"; w.append(ta,b); item.append(w,res,sm);
        }else{
          const cs=document.createElement("div"); cs.className="choices";
          it.choices.forEach((c,ci)=>{ const b=document.createElement("button"); b.type="button"; b.className="ch"; b.innerHTML='<span class="oval">'+lb(ci)+'</span><span class="ctext">'+rich(c)+'</span>';
            b.addEventListener("click",()=>{ if(item.dataset.done) return; item.dataset.done="1"; const ok=ci===it.a;
              cs.querySelectorAll(".ch").forEach((y,yi)=>{ y.classList.toggle("on",yi===ci); if(yi===it.a) y.classList.add("correct"); if(yi===ci&&!ok) y.classList.add("wrong"); });
              item.classList.add("graded"); showEx(ok); });
            cs.appendChild(b); });
          item.append(cs,res);
        }
        box.appendChild(item);
      });
      main.appendChild(box);
    });
  }
  function route(){ if(location.hash==="#miss") renderMiss(); else { const d=fromHash(); if(d) current=d; render(); updateMissLink(); } }
  window.addEventListener("hashchange",route);
  route();
}
})();
</script>
